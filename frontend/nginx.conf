# Custom nginx config for the Runway frontend.
# Runs under the unprivileged nginx user from nginxinc/nginx-unprivileged.
# Listens on 8080 (the unprivileged image's default); compose maps host 5173 to
# container 8080 so http://localhost:5173 keeps the dev-server URL.

worker_processes  auto;
error_log         /dev/stderr warn;
pid               /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging goes to the container's stdout/stderr so `docker logs` works.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens off;

    # The unprivileged image cannot write to /var/cache/nginx, so point the
    # temp paths somewhere writable.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Gzip — Vite already produces compressible JS/CSS bundles.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml application/xml+rss
                      image/svg+xml;

    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Hashed Vite assets live under /assets and are content-addressed, so we
        # can cache them aggressively. index.html itself must never be cached
        # or users won't pick up new bundle hashes after a deploy.
        location /assets/ {
            access_log off;
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Reverse-proxy API calls to the backend service on the compose network.
        # The frontend client always uses relative /api/... paths so this is the
        # single integration point between the two containers.
        location /api/ {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # SPA fallback. Cheap insurance: the app has no router today, but if
        # one is added later, deep links keep working without a redeploy.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
